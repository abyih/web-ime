<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethiopic Web IME Suite</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #212529;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .card {
            background-color: #2c3034;
            border: none;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="mb-5">Ethiopic Web IME Suite</h1>
        <div class="row justify-content-center g-4">
            <div class="col-md-5">
                <div class="card p-4 h-100">
                    <h3>Desktop IME</h3>
                    <p class="text-secondary">Type with your physical keyboard using phonetic mapping.</p>
                    <a href="desktop_ime/index.html" class="btn btn-primary mt-auto">Open Desktop Version</a>
                </div>
            </div>
            <div class="col-md-5">
                <div class="card p-4 h-100">
                    <h3>Mobile IME</h3>
                    <p class="text-secondary">Interactive on-screen keyboard for touch or mouse input.</p>
                    <a href="mobile_ime/index.html" class="btn btn-success mt-auto">Open Mobile Version</a>
                </div>
            </div>
        </div>
        <footer class="mt-5 text-secondary">
            <small>Developed by Your Name</small>
        </footer>
    </div>
</body>
</html>
